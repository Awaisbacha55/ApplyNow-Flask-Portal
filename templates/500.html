{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <i data-lucide="server-crash" class="error-icon" style="color: #ef4444;"></i>
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. Please try submitting your application again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt-4">Return Home</a>
    </div>
</div>
{% endblock %}
