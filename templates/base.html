<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ApplyNow — Your next opportunity starts here{% endblock %}</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="brand">
                <i data-lucide="briefcase" class="brand-icon"></i>
                <span class="brand-name">ApplyNow</span>
            </a>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('index') }}#careers">Careers</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
            </ul>
            <a href="{{ url_for('index') }}#application-form" class="btn btn-primary nav-apply-btn">Apply Now</a>
            
            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
                <i data-lucide="menu"></i>
            </button>
        </div>
        <!-- Mobile Dropdown -->
        <div class="mobile-menu" id="mobile-menu">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('index') }}#careers">Careers</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('index') }}#application-form" class="btn btn-primary">Apply Now</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <i data-lucide="briefcase"></i>
                <span>ApplyNow</span>
            </div>
            <p>&copy; 2024 ApplyNow Job Portal. A practical demonstration project.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
