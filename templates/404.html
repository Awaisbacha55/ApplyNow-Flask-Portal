{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <i data-lucide="file-question" class="error-icon"></i>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>{{ custom_message if custom_message else "The page or application reference you are looking for does not exist or has been moved." }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary mt-4">Return Home</a>
    </div>
</div>
{% endblock %}
